[project]
name = "dreaming"
version = "0.1.0"
description = "Targeted counterfactual dreams with fast-to-slow policy consolidation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "crafter==1.8.3",
    "numba>=0.60",  # JIT for opensimplex: Crafter world generation drops from ~0.5 s per reset
    "minigrid>=2.3",
    "gymnasium>=1.0",
    "tyro>=0.8",
    "wandb>=0.17",
    "rliable>=1.0",
    "pandas>=2.0,<3",  # rliable -> arch 7.2 breaks with pandas 3 (deprecate_kwarg signature)
    "jax>=0.4.30",
    "jax[cuda12]>=0.4.30 ; sys_platform == 'linux'",
    "flax>=0.8",
    "optax>=0.2",
    "craftax==1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreaming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs/brief", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["dreaming", "tests", "analysis"]
exclude = [
    "dreaming/agent",
    "dreaming/envs/base.py",
    "dreaming/envs/crafter_env.py",
    "dreaming/envs/minigrid_env.py",
    "dreaming/envs/pool.py",
    "dreaming/phases",
    "dreaming/train.py",
    "tests/test_dream.py",
    "tests/test_pool.py",
    "tests/test_restore.py",
]
extraPaths = ["analysis"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "dreaming"

[[tool.importlinter.contracts]]
name = "train > phases > agent | envs > config"
type = "layers"
layers = [
    "dreaming.train",
    "dreaming.phases",
    "dreaming.agent | dreaming.envs",
    "dreaming.config",
]
