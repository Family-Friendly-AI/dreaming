[project]
name = "dreaming"
version = "0.1.0"
description = "Targeted counterfactual dreams with fast-to-slow policy consolidation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "tyro>=0.8",
    "wandb>=0.17",
    "rliable>=1.0",
    "pandas>=2.0,<3",  # rliable -> arch 7.2 breaks with pandas 3 (deprecate_kwarg signature)
    "jax>=0.4.30",
    "jax[cuda12]>=0.4.30 ; sys_platform == 'linux'",
    "flax>=0.8",
    "optax>=0.2",
    "craftax==1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dreaming"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["docs/brief", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"torch".msg = "The learner is JAX: use flax/optax via dreaming.agent."
"crafter".msg = "The env is Craftax-Classic: use dreaming.envs.craftax."
"minigrid".msg = "MiniGrid was removed: use a tiny Craftax config (max_episode_steps, num_envs) in tests."
"gymnasium".msg = "Envs are pure JAX: use dreaming.envs.craftax.step/reset."
"pickle".msg = "Snapshots are EnvState pytrees: store states in the device buffer and restore with craftax.restore."
"multiprocessing".msg = "Envs are vmapped on device: batch with num_envs instead of worker processes."
"jax.experimental.io_callback".msg = "No host callbacks inside jitted phases: return arrays and log in the Python loop."
"jax.pure_callback".msg = "No host callbacks inside jitted phases: return arrays and log in the Python loop."
"jax.debug.callback".msg = "No host callbacks inside jitted phases: return arrays and log in the Python loop."

[tool.pyright]
include = ["dreaming", "tests", "analysis"]
extraPaths = ["analysis"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "dreaming"

[[tool.importlinter.contracts]]
name = "train > state > phases > agent | envs > config"
type = "layers"
layers = [
    "dreaming.train",
    "dreaming.state",
    "dreaming.phases",
    "dreaming.agent | dreaming.envs",
    "dreaming.config",
]
